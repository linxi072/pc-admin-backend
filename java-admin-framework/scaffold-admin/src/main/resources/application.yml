spring:
  application:
    name: java-admin-framework
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # Flyway 负责结构初始化，禁止手工改生产表
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  # 本地若未启动 MySQL，可用 init sql；生产关闭
  sql:
    init:
      mode: never

  # 数据源连接属性已迁移至 app.datasources 并按环境外部化到环境变量，避免硬编码。
  # 关闭 Spring Boot 自带单数据源自动装配，改由 app.datasources 多数据源配置接管。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 500ms

  # jOOQ SQL 方言（JooqConfig 中亦显式指定，此处供 Spring Boot 自动配置使用）
  jooq:
    sql-dialect: MYSQL

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    access:
      default: read-only
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

# 调度：JobRunr（替代 XXL-JOB）。
# 存储使用 SQL（复用业务 DataSource），执行使用应用内嵌 BackgroundJobServer，
# 因此不再需要独立调度中心、也不依赖 Redis 或 Docker。
# JobRunr 6.x 配置前缀为 org.jobrunr（5.x 为 jobrunr，已变更）
org:
  jobrunr:
    job-scheduler:
      enabled: true
    background-job-server:
      enabled: true
      worker-count: 4
    dashboard:
      enabled: false
    database:
      type: sql
      # 首次启动由 JobRunr 自动建表（jobrunr_*）；若需由 DBA 统一管控，改为 true 并手动执行建表脚本
      skip-create: false

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit
  process-definition-location-prefix: classpath*:/processes/
  # 关闭 Flowable 自带 REST/IDM，仅用引擎 API
  rest-enabled: false

app:
  # ===== 多数据源 =====
  # 默认主数据源名称；不切换时所有查询落主库（业务表 / Flyway / JobRunr / Flowable 均主库）。
  # 具体连接串与凭据在各 profile yml 中通过环境变量注入，不在此硬编码。
  datasources:
    primary: primary
  # ===== WebSocket 跨域允许来源 =====
  # 默认放开全部来源便于本地前后端分离联调；生产经环境变量 WS_ALLOWED_ORIGINS 收紧为具体前端域名。
  cors:
    allowed-origins: ["*"]
  # ===== 客户端真实 IP 解析 =====
  # 可信反向代理跳数：决定解析 X-Forwarded-For 时自右向左跳过几跳。
  # 客户端可任意伪造 X-Forwarded-For，若直接采信其首段（左段），
  # 限流（IP 为计数键）可被无限换键绕过，审计/登录日志的 IP 也会被污染。
  #   0 = 应用直连公网，完全忽略 X-Forwarded-For，取 TCP 直连地址；
  #   1 = 单级 Nginx（默认）；2+ = 多级代理 / CDN，按实际可信跳数设置。
  web:
    trusted-proxy-count: 1
  # 头像上传目录（相对项目根或绝对路径）。仅存图片文件，文件名由服务端生成。
  upload:
    avatar-dir: ${AVATAR_DIR:./uploads/avatar}
    max-avatar-bytes: 2097152
  file:
    # 本地文件存储根目录（绝对路径或相对路径；生产建议通过环境变量 FILE_STORAGE_DIR 指定绝对路径）
    storage-dir: ${FILE_STORAGE_DIR:./uploads/file}
    # 单文件大小上限（字节），默认 10MB
    max-bytes: 10485760
    # 扩展名白名单（逗号分隔）；同时叠加图片/PDF 魔数校验，拒绝可执行文件伪装
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar,7z
  # ===== 通知渠道（站内信 / Webhook / 邮件） =====
  # 站内信（IN_APP）始终可用；Webhook 与邮件默认关闭，启用并配置后才外发。
  notifications:
    webhook:
      # 是否允许 Webhook 外发（默认 false，缺省关闭避免误发）
      enabled: false
      # 消息未显式带 webhookUrl 时的兜底地址（启用后建议配置）
      default-url:
      # M18 HMAC-SHA256 签名密钥：配置即启用外发签名（防篡改 + 时间戳/nonce 防重放）；
      # 须经环境变量 NOTIFICATION_WEBHOOK_SIGNING_KEY 注入，不写入仓库；留空即不签名（向下兼容明文透传）
      signing-key: ${NOTIFICATION_WEBHOOK_SIGNING_KEY:}
      # 已废弃（legacy）：原明文透传为报文 secret 字段的做法不安全，新接入请改用 signing-key 签名；
      # 保留仅为兼容既有接收方，后续版本将移除
      secret:
      # 读超时 / 连接超时（毫秒）
      timeout-ms: 5000
      connect-timeout-ms: 2000
    # M35 机器人渠道：企业微信 / 钉钉。默认关闭，启用并配置地址后才外发。
    # 机器人地址统一复用消息 webhookUrl 字段；此处 default 仅作兜底。
    wecom:
      # 是否允许企业微信机器人外发（默认 false，缺省关闭避免误发）
      enabled: false
      # 兜底机器人地址（含 key 参数）；消息显式带 webhookUrl 时优先用消息自带地址
      webhook-url:
      # 加签密钥：生产经环境变量 NOTIFICATION_WECOM_SECRET 注入，不写入仓库；
      # 配置后对报文按企业微信算法加签并注入 X-Wechat-Signature 头；留空不签名
      secret: ${NOTIFICATION_WECOM_SECRET:}
    dingtalk:
      # 是否允许钉钉机器人外发（默认 false，缺省关闭避免误发）
      enabled: false
      # 兜底机器人地址；消息显式带 webhookUrl 时优先用消息自带地址
      webhook-url:
      # 加签密钥：生产经环境变量 NOTIFICATION_DINGTALK_SECRET 注入，不写入仓库；
      # 配置后对地址追加 timestamp/secret/signature query 参数；留空不签名
      secret: ${NOTIFICATION_DINGTALK_SECRET:}
    email:
      # 是否允许邮件发送（默认 false，缺省关闭避免误发与启动依赖 SMTP）
      enabled: false
      # 发件人地址（启用后必配）
      from:
      # SMTP 服务器与端口（25 / 465 / 587 依服务商）
      host: localhost
      port: 25
      # 凭据：生产经环境变量 NOTIFICATION_EMAIL_USERNAME / NOTIFICATION_EMAIL_PASSWORD 注入
      username: ${NOTIFICATION_EMAIL_USERNAME:}
      password: ${NOTIFICATION_EMAIL_PASSWORD:}
      # 587 端口通常需开启 STARTTLS 升级
      starttls: false
      # 读写超时（毫秒）
      timeout-ms: 5000
    sms:
      # 是否允许短信发送（默认 false：短信按条计费，缺省关闭避免误发与费用）
      enabled: false
      # 网关实现：LOG（默认，仅打脱敏日志不真发，开发/联调）/ HTTP（通用 HTTP 网关 POST JSON）
      provider: LOG
      # HTTP 模式必配：短信网关接收地址（厂商无关最小契约 appId/appKey/mobiles/content）
      # 示例（含冒号须加引号）："https://sms-gateway.example.com/api/v1/send"
      gateway-url:
      # 网关凭据：生产经环境变量 NOTIFICATION_SMS_APP_KEY 注入
      app-id:
      app-key: ${NOTIFICATION_SMS_APP_KEY:}
      # 短信签名，拼接到正文头部（如【Acme】；留空则不拼）
      signature:
      # HTTP 读超时 / 连接超时（毫秒）
      timeout-ms: 5000
      connect-timeout-ms: 2000
    unsubscribe:
      # M15 退订令牌：是否在邮件/短信正文注入 HMAC 签名退订链接（默认 false，缺省关闭，
      # 不影响既有报文形态；公开端点 GET /api/notification/unsubscribe 始终开放，
      # 但 secret/base-url 未配置时任何令牌都无法通过验签——安全失败）
      enabled: false
      # HMAC-SHA256 密钥：必须经环境变量 NOTIFICATION_UNSUBSCRIBE_SECRET 注入，不写入仓库；
      # 留空即功能未激活（与 jwt-secret 的外部化策略一致）
      secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET:}
      # 退订链接基址（拼 /api/notification/unsubscribe?token=...；尾部斜杠自动归一）
      # 示例："https://admin.example.com"
      base-url:
      # 令牌有效期（小时）：兼顾「稍后决定」与「链接长期漂浮」的权衡
      ttl-hours: 72
    retry:
      # M16 有界重试：适配器投递瞬时故障（非 BusinessException 的运行时异常，如网关 IO 失败）
      # 按次数 + 线性退避重试；业务确定性拒绝（渠道未启用/报文非法）不重试
      enabled: true
      # 单渠道最大尝试次数（含首次；<1 按 1 处理）
      max-attempts: 3
      # 重试基准退避（毫秒）：第 n 次重试前等 n × backoff-ms，总等待有硬上界
      backoff-ms: 200
    failover:
      # M16 故障转移：主适配器彻底失败时切换同渠道备用适配器（至少一次语义，
      # 主适配器「已投递但响应丢失」时会重复投递，故默认关闭，显式开启需评估重复容忍度）
      enabled: false
    digest:
      # M17 聚合摘要：命中类型的定向消息先聚合、按阈值/最大等待时长合并投递（默认关闭，
      # 聚合改变投递时机与报文形态，须显式开启；关闭时 dispatch 行为与 M16 及以前一致）
      enabled: false
      # 命中聚合的消息类型白名单（大小写不敏感；摘要消息自身的 DIGEST 不在其内，防递归挂起）
      msg-types:
        - NOTICE
      # 合并阈值：单用户单 (渠道, 类型) 聚合达该条数立即刷新投递（先到先投）
      threshold: 5
      # 摘要正文保留的条目上限（超出丢弃最旧；全量条数由标题 ${count} 与尾注补偿表达）
      max-items: 50
      # 最大等待时长（分钟）：低流量用户兜底——定时任务扫描 last_at 超期的聚合行强制刷新
      max-wait-minutes: 60
      # 兜底扫描周期（毫秒）
      scan-interval-ms: 60000
      # 摘要标题/正文模板（${count}=全量条数、${items}=条目列表、${date}=统计截止时刻）
      title-template: "您有 ${count} 条新通知"
      content-template: "以下是最近的通知摘要：\n${items}\n（统计截至 ${date}）"
  # ===== 缓存管理（Spring Cache 抽象，Redis 实现） =====
  # 缓存为惰性能力：未使用 @Cacheable 时不产生 Redis 流量。
  # 命中率/条目数统计与清理入口见 GET /api/system/monitor/caches（进程内口径，按实例）。
  cache:
    # @Cacheable 未显式指定时的默认 TTL
    ttl: 30m
    # Redis key 前缀（与业务 key 隔离，便于运维排查与批量清理；含冒号须加引号）
    key-prefix: "acme:cache:"
  security:
    issuer: java-admin-framework
    audience: admin-api
    # token 超时延长（配合验证码 + 多端登录限制整体提升会话安全）：access 15m→30m，refresh 7d→30d
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    max-login-failures: 5
    lock-duration: 15m
    # 同一账号同时在线设备数上限（<=0 不限制）；超出时策略 reject=拒绝新登录 / evict_oldest=淘汰最早登录（会话挤占）
    max-concurrent-sessions: 3
    session-eviction-strategy: evict_oldest
    # 异常退出会话回收：刷新令牌空闲超过该时长即被吊销（进程崩溃 / 连接中断后 token 及时失效）
    session-max-inactive: 30m
    session-cleanup-enabled: true
    session-cleanup-interval-ms: 300000
    # JWT 签名密钥：必须通过环境变量 JWT_SECRET 提供（Base64 编码、≥256 位）。
    # 未配置时不使用任何硬编码默认值，将自动生成仅当前进程有效的随机临时密钥（重启失效），仅用于开发/测试。
    jwt-secret: ${JWT_SECRET:}
  # 慢 SQL 阈值（毫秒），由 JooqConfig 注入 SlowQueryListener
  jooq:
    slow-query-threshold-ms: 500
    # N+1 查询探测：同构 SQL 在单线程（通常对应一次请求）内执行达阈值即告警，
    # 由 JooqConfig / DataSourceConfig 装配 NPlusOneListener（双路观测，只读、零业务影响）
    nplus1-threshold: 10
    # N+1 疑似事件留存容量（有界环形缓冲，超出按入队序淘汰最旧；越大越利于复盘频次，内存占用同比例增长）
    nplus1-max-suspects: 200
  audit:
    async: true

# 可观测性导出（A1）：OTLP/HTTP span 导出至 Collector（Jaeger / Tempo / OTel Collector）。
# 默认关闭；具备 Collector 的环境置 enabled=true 并指向其 /v1/traces 端点。
# 说明：本项目离线构建未引入 opentelemetry-sdk，此处为零依赖自研 OTLP 导出器，
#       与既有 W3C traceparent / MDC traceId 对齐；联网环境可平滑切换至官方 SDK（-Potel）。
observability:
  otlp:
    enabled: false
    endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    service-name: ${spring.application.name}
    timeout-ms: 2000
  # 本地 span 记录（与 OTLP 导出正交）：应用内有界内存留存最近 N 条请求 span，
  # 供 GET /api/observability/traces 回溯（Collector 未部署时尤其有用）。
  # 容量超出后按入队序淘汰最旧记录；置 enabled=false 可关闭（过滤器双开关均关时零开销透传）。
  recorder:
    enabled: true
    capacity: 200

# 告警接收（A2）：作为 Alertmanager 的真实 webhook 接收端（应用内）。
# token 非空时要求请求携带匹配的 X-Alert-Token 头；生产须由网络/网关层加固。
monitoring:
  alert:
    webhook:
      enabled: true
      token: ${ALERT_WEBHOOK_TOKEN:}
    inbox-capacity: 200

# 海量数据有序消费（Kafka）：默认关闭——无集群环境（本地/CI）不建连。
# 保序四要素见 docs/manual/kafka-ordered-consumer.md：
#   ①生产端同 key 经 murmur2 稳定落同一分区 + enable.idempotence=true（max.in.flight<=5）
#   ②容器单线程按分区 offset 升序串行处理（禁同分区并发）
#   ③消息头 x-version 携带业务版本号，消费端「严格大于才处理」丢弃乱序旧版本
#   ④enable.auto.commit=false + 整批处理完成后手动 commitSync（at-least-once）
# 启用：enabled=true 并指向集群；业务方实现 OrderedRecordHandler 并标注 @Primary 接管处理。
kafka:
  ordered-consumer:
    enabled: ${KAFKA_ORDERED_CONSUMER_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    group-id: ${KAFKA_GROUP_ID:scaffold-ordered-consumer}
    topic: ${KAFKA_TOPIC:business.data.updated}
    poll-timeout: 200ms
    max-poll-records: 500
  # Kafka 网关（消息生产侧）：默认关闭——无集群环境（本地/CI）不建连。
  # 启用：enabled=true 并指向集群；消息总线 KafkaBus 经 kafka.gateway.* 统一参数装配。
  # 拓扑（分区/副本/保留/扇出分片）为单一事实来源：com.acme.scaffold.kafka.gateway.topology.Topology.designDefault(144,64)。
  # 其余调优项（linger-ms/batch-size/retries）未配置时取代码内置默认值，开启幂等时 acks 强制 all。
  gateway:
    enabled: ${KAFKA_GATEWAY_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_GATEWAY_CLIENT_ID:scaffold-kafka-gateway}
    acks: ${KAFKA_GATEWAY_ACKS:all}
    compression-type: ${KAFKA_GATEWAY_COMPRESSION:zstd}
    enable-idempotence: true

# 实时 WebSocket 网关（realtime.gateway.*）：传输无关节点内核 GatewayNode 已随 scaffold-realtime 装配
# （默认 enabled=true）。下行统一走 common.messaging 二进制信封；无 Kafka 集群时总线由 LocalBus 兜底，
# 开启 kafka.gateway.enabled=true 则自动改投 KafkaBus。握手鉴权默认复用框架 JWT 端口
# （security.jwt 的 HandshakeTokenAuthenticator 适配器）；开启 hmac.enabled=true 则改走
# HMAC 短期令牌（须配置 secret，生产经外部密钥源注入）。未列出项取 GatewayProperties 代码默认值，
# 关闭码语义（4001 鉴权失败 / 4003 协议错误 / 4028 限流 / 4029 慢消费者 / 4030 空闲 / 1001 优雅退出 /
# 4027 容量耗尽 / 4009 同节点重连顶替）与原 ws-kafka-gateway 保持一致。
realtime:
  gateway:
    enabled: ${REALTIME_GATEWAY_ENABLED:true}
    max-connections-per-node: ${REALTIME_GATEWAY_MAX_CONNECTIONS:200000}
    rate-per-conn-per-sec: ${REALTIME_GATEWAY_RATE:100}
    burst-per-conn: ${REALTIME_GATEWAY_BURST:500}
    gateway-id: ${REALTIME_GATEWAY_ID:}
    heartbeat:
      ping-interval-ms: ${REALTIME_GATEWAY_PING_MS:30000}
      idle-timeout-ms: ${REALTIME_GATEWAY_IDLE_MS:90000}
      route-ttl-ms: ${REALTIME_GATEWAY_ROUTE_TTL_MS:90000}
    slow-consumer:
      queue-limit: ${REALTIME_GATEWAY_QUEUE_LIMIT:1000}
      node-high-water: ${REALTIME_GATEWAY_NODE_HIGH_WATER:0.70}
    drain:
      inflight-timeout-ms: 30000
      flush-timeout-ms: 5000
    hmac:
      enabled: ${REALTIME_GATEWAY_HMAC_ENABLED:false}
      secret: ${REALTIME_GATEWAY_HMAC_SECRET:}

# 外部密钥源（A4）：默认 local（沿用环境变量 / 随机临时密钥，离线可用）；
# 接入 HashiCorp Vault 时置 provider=vault 并配置 address / token / paths。
secret:
  provider: ${SECRET_PROVIDER:local}
  vault:
    address: ${VAULT_ADDR:http://localhost:8200}
    token: ${VAULT_TOKEN:}
    paths:
      jwt-secret: secret/data/admin/jwt
      previous-jwt-secret: secret/data/admin/jwt-previous
  local:
    secrets: {}

logging:
  level:
    root: INFO
    com.acme.scaffold: DEBUG
