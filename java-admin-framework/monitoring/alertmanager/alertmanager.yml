# Alertmanager 配置（G2 原生部署）
# 启动：alertmanager --config.file=alertmanager.yml
global:
  resolve_timeout: 5m
  # 以下 SMTP / webhook 为占位，请按实际环境替换
  smtp_smarthost: "localhost:25"
  smtp_from: "alertmanager@java-admin-framework.local"

route:
  receiver: default-webhook
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical-webhook
      continue: true

receivers:
  # A2：应用内真实接收端（java-admin-framework 的 /api/monitoring/alerts/webhook）。
  # 应用侧完成解析、入库与事件发布；如需额外外部通道（企业微信/钉钉/Slack），
  # 可在此追加 webhook_configs 指向对应网关，或订阅 AlertReceivedEvent 转发。
  - name: default-webhook
    webhook_configs:
      - url: "http://localhost:8080/api/monitoring/alerts/webhook"
        send_resolved: true
  - name: critical-webhook
    webhook_configs:
      - url: "http://localhost:8080/api/monitoring/alerts/webhook"
        send_resolved: true
    email_configs:
      - to: "oncall@java-admin-framework.local"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]
