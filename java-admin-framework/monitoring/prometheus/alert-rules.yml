# Prometheus 告警规则（G2）
# 阈值对齐《方案》§15 阶段 4 / 验收清单：错误率>1%、P99>800ms、老年代>80%、连接池>85%、JobRunr 失败>0。
groups:
  - name: java-admin-framework.rules
    rules:
      - alert: HttpErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          service: java-admin-framework
        annotations:
          summary: "HTTP 5xx 错误率超过 1%（持续 5m）"
          description: "当前 5xx 错误率 {{ $value | humanizePercentage }}，阈值 1%。请检查应用日志与下游依赖。"

      - alert: HttpP99LatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          service: java-admin-framework
        annotations:
          summary: "HTTP P99 延迟超过 800ms（持续 5m）"
          description: "P99 延迟 {{ $value | humanizeDuration }}，阈值 0.8s。"

      - alert: JvmOldGenUsageHigh
        expr: |
          sum(jvm_memory_used_bytes{id=~".*Old.*"})
            / sum(jvm_memory_max_bytes{id=~".*Old.*"}) > 0.8
        for: 10m
        labels:
          severity: warning
          service: java-admin-framework
        annotations:
          summary: "JVM 老年代使用率超过 80%（持续 10m）"
          description: "老年代使用率 {{ $value | humanizePercentage }}，阈值 80%，存在 Full GC / OOM 风险。"

      - alert: HikariCpConnectionsHigh
        expr: |
          sum(hikaricp_connections_active) / sum(hikaricp_connections_max) > 0.85
        for: 5m
        labels:
          severity: warning
          service: java-admin-framework
        annotations:
          summary: "HikariCP 连接池使用率超过 85%（持续 5m）"
          description: "连接池使用率 {{ $value | humanizePercentage }}，阈值 85%，可能存在连接泄漏或慢查询。"

      - alert: JobRunrFailedJobs
        expr: increase(jobrunr_jobs_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: java-admin-framework
        annotations:
          summary: "JobRunr 近 10m 出现失败任务"
          description: "失败任务增量 {{ $value }}，请检查 JobRunr 后台与 jobrunr_jobs 表。"
