# OpenTelemetry Collector 配置（C6）：接收应用经自研 OTLP/HTTP 导出器发来的 span，
# 汇聚后可供调试（debug  exporter 输出到容器日志）与 Prometheus 抓取（prometheus exporter）。
# 版本：otel/opentelemetry-collector-contrib（含 prometheus / debug exporter）。
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  # 调试导出器：将 span 概要输出到 Collector 容器日志，便于无后端时验证链路是否打通
  debug:
    verbosity: normal
  # Prometheus 抓取端点：暴露 trace 衍生的指标（如 otelcol_*），由 compose 中 prometheus 服务抓取
  prometheus:
    endpoint: 0.0.0.0:8889

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
