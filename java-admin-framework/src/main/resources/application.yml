spring:
  application:
    name: java-admin-framework
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # Flyway 负责结构初始化，禁止手工改生产表
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  # 本地若未启动 MySQL，可用 init sql；生产关闭
  sql:
    init:
      mode: never

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 500ms

  # jOOQ SQL 方言（JooqConfig 中亦显式指定，此处供 Spring Boot 自动配置使用）
  jooq:
    sql-dialect: MYSQL

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    access:
      default: read-only
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

# 调度：JobRunr（替代 XXL-JOB）。
# 存储使用 SQL（复用业务 DataSource），执行使用应用内嵌 BackgroundJobServer，
# 因此不再需要独立调度中心、也不依赖 Redis 或 Docker。
# JobRunr 6.x 配置前缀为 org.jobrunr（5.x 为 jobrunr，已变更）
org:
  jobrunr:
    job-scheduler:
      enabled: true
    background-job-server:
      enabled: true
      worker-count: 4
    dashboard:
      enabled: false
    database:
      type: sql
      # 首次启动由 JobRunr 自动建表（jobrunr_*）；若需由 DBA 统一管控，改为 true 并手动执行建表脚本
      skip-create: false

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit
  process-definition-location-prefix: classpath*:/processes/
  # 关闭 Flowable 自带 REST/IDM，仅用引擎 API
  rest-enabled: false

app:
  security:
    issuer: java-admin-framework
    audience: admin-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-login-failures: 5
    lock-duration: 15m
    jwt-secret: ${JWT_SECRET:ZmQ4ZjMxYmEtY2IzMC00Y2IwLTkzNmItM2I0Y2MxNzQwYzYz}
  # 慢 SQL 阈值（毫秒），由 JooqConfig 注入 SlowQueryListener
  jooq:
    slow-query-threshold-ms: 500
  audit:
    async: true

logging:
  level:
    root: INFO
    com.acme.scaffold: DEBUG
