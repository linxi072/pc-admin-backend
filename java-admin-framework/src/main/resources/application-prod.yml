spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    # 生产环境结构变更必须走已评审迁移文件
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产不暴露 JobRunr Dashboard，仅运行后台作业服务
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 8
  dashboard:
    enabled: false

# 登录验证码：开启后 /api/auth/login 必须携带 GET /api/auth/captcha 下发的 token 与答案
auth:
  captcha:
    enabled: true
    expire-seconds: 120
    max-number: 20
  # 请求级防重放（opt-in）：默认关闭，避免未携带时间戳/nonce 头的既有登录链路（含前端、InstanceIntegrationIT）被阻断。
  # 启用后前端需为每个 /api/auth/login、/api/auth/refresh 请求附带 X-Request-Timestamp 与 X-Request-Nonce 头。
  anti-replay:
    enabled: false
    max-clock-skew-millis: 5000
    nonce-ttl-seconds: 60
    max-nonce-cache-size: 100000

logging:
  level:
    com.acme.scaffold: INFO
