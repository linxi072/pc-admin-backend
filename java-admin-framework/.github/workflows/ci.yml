name: CI

# G4 质量门禁：push / PR 触发；单元（surefire *Test）与集成（failsafe *IT，MySQL 服务容器）全绿方可通过；
# 任一测试失败即流水线失败并阻断合并。静态扫描（SCA）作为非阻塞 advisory 作业。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "V1.0.4"]

jobs:
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & run unit tests
        # surefire 仅执行 *Test；默认 skipITs=true，不会触发集成测试
        run: mvn -B test

  integration-test:
    name: Integration Tests (MySQL)
    runs-on: ubuntu-latest
    # 集成测试需本机/CI MySQL + Flyway 初始化（V1~V18）
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pwd
          MYSQL_DATABASE: java_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/java_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_root_pwd
      SPRING_FLYWAY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests
        # verify 阶段由 failsafe 执行 *IT（skipITs 关闭）；Flyway 自动建表
        run: mvn -B verify -DskipITs=false

  sca:
    name: Dependency SCA (advisory)
    runs-on: ubuntu-latest
    # 可选静态扫描门禁：非阻塞，失败不阻断合并（G4「可选覆盖率/静态扫描门禁」）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check
        run: mvn -B org.owasp:dependency-check-maven:10.0.4:check -DfailOnError=false
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
