name: Scheduled Security Scan (SCA)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache dependency-check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dc-nvd-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-dc-nvd-
      - name: OWASP Dependency-Check (block on CVSS>=9 via -Psca)
        run: mvn -B -Psca -DskipTests -DskipITs verify
