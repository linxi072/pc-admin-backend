# Bean Validation 约束消息（简体中文）。
# 键名规范：validation.<域>.<字段>[.<约束>]；通用约束（用户名/密码/标题/内容）不带域前缀以便跨 DTO 复用。
# DTO 注解以 message = "{<键>}"（花括号键，触发 Hibernate 资源束查找）引用，由 ValidationMessageConfig 委托 MessageSource 插值。

# ---- 通用约束（跨 DTO 复用）----
validation.username.notBlank=用户名不能为空
validation.oldPassword.notBlank=原密码不能为空
validation.password.notBlank=新密码不能为空
validation.password.size=密码长度需为 8~64 位
validation.title.size=标题长度不能超过200
validation.messageContent.notBlank=消息内容不能为空

# ---- 用户岗位兼任（AssignUserPostsRequest）----
validation.userPosts.size=单个用户最多可兼任10个岗位

# ---- 数据权限范围（SaveDataScopeRequest）----
validation.dataScope.code.notBlank=资源编码不能为空
validation.dataScope.code.size=资源编码长度不能超过 128
validation.dataScope.type.notBlank=数据范围类型不能为空
validation.dataScope.orgIds.size=自定义机构数量不能超过 500

# ---- 联系渠道绑定（BindContactRequest）----
validation.contact.channel.notBlank=渠道不能为空
validation.contact.channel.pattern=渠道仅支持 MOBILE 或 EMAIL

# ---- 用户创建（CreateUserRequest）----
validation.user.roleIds.notEmpty=至少绑定一个角色
validation.user.deptIds.notEmpty=至少归属一个部门

# ---- 登录限制（RestrictLoginRequest）----
validation.restrictLogin.duration.notNull=请选择限制时长
validation.restrictLogin.reason.notBlank=请填写限制原因
validation.restrictLogin.reason.size=限制原因不能超过 255 字

# ---- 岗位管理（CreatePostRequest / UpdatePostRequest）----
validation.post.code.notBlank=岗位编码不能为空
validation.post.code.size=岗位编码长度不能超过64
validation.post.name.notBlank=岗位名称不能为空
validation.post.name.size=岗位名称长度不能超过100
validation.post.remark.size=备注长度不能超过512

# ---- 强制下线（ForceLogoutRequest）----
validation.forceLogout.sessionIds.notEmpty=请至少选择一个在线会话
validation.forceLogout.sessionIds.size=单次最多强制下线 100 个会话

# ---- 公告（CreateAnnouncementRequest / UpdateAnnouncementRequest）----
validation.announcement.content.notBlank=公告内容不能为空

# ---- 个人资料（UpdateProfileRequest）----
validation.profile.nickname.notBlank=昵称不能为空
validation.profile.nickname.size=昵称长度不能超过 100
validation.profile.mobile.pattern=手机号格式不正确
validation.profile.email.pattern=邮箱格式不正确
validation.profile.avatar.size=头像地址过长

# ---- 偏好设置（UpdatePreferenceRequest / 通知订阅 UpdateNotificationPreferenceRequest）----
validation.preference.switch.range=开关取值只能为 0 或 1
validation.preference.items.notEmpty=偏好项不能为空
validation.preference.items.size=偏好项数量不能超过16

# ---- 免打扰时段（UpdateQuietHoursRequest，V44）----
validation.quietHours.switch.notNull=免打扰开关不能为空
validation.quietHours.time.notBlank=免打扰起止时间不能为空

# ---- 实时推送管理（RealtimeBroadcastRequest / RealtimeUserPushRequest）----
validation.realtime.type.notBlank=推送消息类型不能为空
validation.realtime.userIds.notEmpty=请至少指定一个接收用户

# ---- 通知模板中心（CreateNotificationTemplateRequest / UpdateNotificationTemplateRequest，V41）----
validation.templateCode.size=模板编码长度不能超过64
validation.templateCode.notBlank=模板编码不能为空
validation.templateName.size=模板名称长度不能超过100
validation.channel.notBlank=渠道不能为空
validation.templateTitle.size=标题长度不能超过200
validation.templateContent.notBlank=模板内容不能为空
validation.remark.size=备注长度不能超过255
