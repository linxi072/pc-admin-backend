# Bean Validation constraint messages (English).
# Key convention: validation.<domain>.<field>[.<constraint>]; generic constraints (username/password/title/content)
# have no domain prefix so they can be reused across DTOs.
# DTO annotations reference these via message = "{<key>}" (a brace-enclosed key that triggers
# Hibernate's resource-bundle lookup), interpolated by ValidationMessageConfig delegating to the
# Spring MessageSource.

# ---- Generic constraints (shared across DTOs) ----
validation.username.notBlank=Username must not be empty
validation.oldPassword.notBlank=Current password must not be empty
validation.password.notBlank=New password must not be empty
validation.password.size=Password must be 8 to 64 characters long
validation.title.size=Title must not exceed 200 characters
validation.messageContent.notBlank=Message content must not be empty

# ---- User post assignment (AssignUserPostsRequest) ----
validation.userPosts.size=A user may hold at most 10 posts

# ---- Data permission scope (SaveDataScopeRequest) ----
validation.dataScope.code.notBlank=Resource code must not be empty
validation.dataScope.code.size=Resource code must not exceed 128 characters
validation.dataScope.type.notBlank=Data scope type must not be empty
validation.dataScope.orgIds.size=Custom organization count must not exceed 500

# ---- Contact channel binding (BindContactRequest) ----
validation.contact.channel.notBlank=Channel must not be empty
validation.contact.channel.pattern=Channel only supports MOBILE or EMAIL

# ---- User creation (CreateUserRequest) ----
validation.user.roleIds.notEmpty=At least one role must be bound
validation.user.deptIds.notEmpty=At least one department is required

# ---- Login restriction (RestrictLoginRequest) ----
validation.restrictLogin.duration.notNull=Please select a restriction duration
validation.restrictLogin.reason.notBlank=Please provide a restriction reason
validation.restrictLogin.reason.size=Restriction reason must not exceed 255 characters

# ---- Post management (CreatePostRequest / UpdatePostRequest) ----
validation.post.code.notBlank=Post code must not be empty
validation.post.code.size=Post code must not exceed 64 characters
validation.post.name.notBlank=Post name must not be empty
validation.post.name.size=Post name must not exceed 100 characters
validation.post.remark.size=Remark must not exceed 512 characters

# ---- Force logout (ForceLogoutRequest) ----
validation.forceLogout.sessionIds.notEmpty=Please select at least one online session
validation.forceLogout.sessionIds.size=At most 100 sessions can be forced offline at a time

# ---- Announcement (CreateAnnouncementRequest / UpdateAnnouncementRequest) ----
validation.announcement.content.notBlank=Announcement content must not be empty

# ---- Profile (UpdateProfileRequest) ----
validation.profile.nickname.notBlank=Nickname must not be empty
validation.profile.nickname.size=Nickname must not exceed 100 characters
validation.profile.mobile.pattern=Invalid mobile number format
validation.profile.email.pattern=Invalid email format
validation.profile.avatar.size=Avatar URL is too long

# ---- Preferences (UpdatePreferenceRequest) ----
validation.preference.switch.range=Switch value can only be 0 or 1

# ---- Realtime push management (RealtimeBroadcastRequest / RealtimeUserPushRequest) ----
validation.realtime.type.notBlank=Push message type must not be empty
validation.realtime.userIds.notEmpty=Specify at least one recipient user

# ---- Notification template center (CreateNotificationTemplateRequest / UpdateNotificationTemplateRequest, V41) ----
validation.templateCode.size=Template code must not exceed 64 characters
validation.templateName.size=Template name must not exceed 100 characters
validation.channel.notBlank=Channel must not be empty
validation.templateTitle.size=Title must not exceed 200 characters
validation.templateContent.notBlank=Template content must not be empty
validation.remark.size=Remark must not exceed 255 characters
